@if (password().length > 0) {
  <div class="strength-meter-container animate-fade-in" aria-live="polite">
    <!-- Progress Bars & Level Label -->
    <div class="meter-header">
      <span class="label">Password strength</span>
      <span class="score-level" [class]="'level-' + evaluation().level">
        {{ evaluation().feedback }}
      </span>
    </div>

    <div class="meter-bars" role="progressbar" [attr.aria-valuenow]="evaluation().score" aria-valuemin="0" aria-valuemax="4">
      <div class="bar-segment" [class.active]="evaluation().score >= 1" [class]="'fill-' + evaluation().level"></div>
      <div class="bar-segment" [class.active]="evaluation().score >= 2" [class]="'fill-' + evaluation().level"></div>
      <div class="bar-segment" [class.active]="evaluation().score >= 3" [class]="'fill-' + evaluation().level"></div>
      <div class="bar-segment" [class.active]="evaluation().score >= 4" [class]="'fill-' + evaluation().level"></div>
    </div>

    <!-- Requirements Checklist -->
    @if (showRequirements()) {
      <div class="requirements-grid">
        @for (req of evaluation().requirements; track req.id) {
          <div class="requirement-item" [class.met]="req.met">
            <span class="status-icon" aria-hidden="true">
              @if (req.met) {
                <app-icon name="check" [size]="12" />
              } @else {
                <span class="dot"></span>
              }
            </span>
            <span class="req-label">{{ req.label }}</span>
          </div>
        }
      </div>
    }
  </div>
}
