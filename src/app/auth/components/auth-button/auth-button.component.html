<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  [attr.aria-busy]="loading()"
  [attr.aria-disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel() || null"
  (click)="handleClick($event)">
  @if (loading()) {
    <span class="spinner" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle class="spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/>
        <path class="spinner-head" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
      </svg>
    </span>
    <span class="loading-text"><ng-content select="[slot=loading]"></ng-content></span>
  } @else {
    @if (icon() && iconPosition() === 'left') {
      <app-icon [name]="icon()!" [size]="iconSize()" class="btn-icon-left" />
    }
    
    <span class="btn-content">
      <ng-content></ng-content>
    </span>

    @if (icon() && iconPosition() === 'right') {
      <app-icon [name]="icon()!" [size]="iconSize()" class="btn-icon-right" />
    }
  }
</button>
