<app-auth-layout
  title="Two-Factor Authentication"
  subtitle="Enter the 6-digit security code generated by your enterprise authenticator app."
  badgeText="Step-up Verification"
  [showBackLink]="true"
  backLinkUrl="/auth/login"
  backLinkLabel="Back to sign in">
  
  <!-- Error / Alert Banner -->
  @if (authService.error()) {
    <app-alert-banner
      type="error"
      [message]="authService.error()!"
      (dismissed)="authService.clearMessages()" />
  }

  <div class="mfa-verify-content">
    <!-- Target Email Indicator -->
    <div class="mfa-target-badge">
      <app-icon name="fingerprint" [size]="16" />
      <span>Authenticating: <strong>{{ userEmail() }}</strong></span>
    </div>

    <!-- Demo Quick Auto-fill -->
    <div class="mfa-demo-bar">
      <span>Demo 2FA Code:</span>
      <button type="button" class="mfa-fill-chip" (click)="fillDemoOtp('748921')">
        748921
      </button>
    </div>

    <!-- 6-Digit OTP Form -->
    <form (ngSubmit)="onSubmit()" class="otp-form">
      <div class="otp-inputs-grid">
        @for (digit of digits; track $index) {
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            pattern="[0-9]*"
            class="otp-digit-input"
            [value]="otpValues()[$index]"
            (input)="handleInput($event, $index)"
            (keydown)="handleKeyDown($event, $index)"
            (paste)="handlePaste($event)"
            [attr.aria-label]="'Verification digit ' + ($index + 1)" />
        }
      </div>

      <!-- Submit Button -->
      <app-auth-button
        type="submit"
        variant="primary"
        size="md"
        [disabled]="!isOtpComplete() || authService.isLoading()"
        [loading]="authService.isLoading()">
        Verify & Authenticate
        <span slot="loading">Verifying Security Code...</span>
      </app-auth-button>

      <!-- Alternative Options -->
      <div class="mfa-alternative-actions">
        <button
          type="button"
          class="backup-code-btn"
          (click)="useBackupCode()">
          <app-icon name="key" [size]="14" />
          <span>Use enterprise backup emergency code</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Footer Slot -->
  <div slot="footer" class="auth-footer-prompt">
    <span>Lost access to your authenticator?</span>
    <a href="mailto:support@omni-bridge.com" class="footer-action-link">
      Contact Omni-Bridge Support
    </a>
  </div>
</app-auth-layout>
